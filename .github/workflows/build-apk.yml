name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download portal source
        run: |
          curl -L -o source.zip "https://muse.ai/files/1422772990918355/1659715289165511/edrzvtz24wjauztycow4t9p3/digiskool-portal-src.zip"
          unzip -q source.zip
          ls digiskool-flutter/lib/main.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        working-directory: digiskool-flutter
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: digiskool-portal-apk
          path: digiskool-flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Create public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "DigiSkool Portal v1.0 — Professional"
          body: "DigiSkool Institute Management Portal — Android APK (professional redesign: new login, dark mode, campus-split dashboard, JSON backup, 3-part voucher print, support chat)."
          files: digiskool-flutter/build/app/outputs/flutter-apk/app-release.apk
