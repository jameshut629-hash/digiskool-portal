name: Deploy Portal to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download portal source
        run: |
          curl -L -o source.zip "https://muse.ai/files/1422772990918355/1657040955927989/g38u8maxe8zaws5clim6qpd7/digiskool-portal-src.zip"
          unzip -q source.zip
          ls digiskool-flutter/lib/main.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build web
        working-directory: digiskool-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /digiskool-portal/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: digiskool-flutter/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
